version: '3'

services:
  # NestJS Application
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=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
    depends_on:
      - redis
      - elasticsearch
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
  
  # Redis service for BullMQ job queue
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
  
  # Elasticsearch service for vector store
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.0
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

# Persistent volumes
volumes:
  redis-data:
  es-data: 