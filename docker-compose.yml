version: '3'

services:
  # NestJS Application
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - API_KEY=your_secure_api_key_here
      - OPENAI_API_KEY=dummy_key_for_compatibility
    depends_on:
      - redis
      - elasticsearch
      - ollama
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
  
  # Redis service for BullMQ job queue
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
  
  # Elasticsearch service for vector store
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.0
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # Ollama service for LLM inference
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # GPU support is optional
    # Uncomment the following section if you have an NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

# Persistent volumes
volumes:
  redis-data:
  es-data:
  ollama-models: 