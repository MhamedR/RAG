<!DOCTYPE html>
<html>
<head>
    <title>Document Upload Test</title>
</head>
<body>
    <h1>Upload Document</h1>
    <form action="http://localhost:3000/api/api/documents/upload" method="post" enctype="multipart/form-data">
        <div>
            <label for="file">Choose file:</label>
            <input type="file" id="file" name="file" required>
        </div>
        <div>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" value="Test Document">
        </div>
        <div>
            <label for="author">Author:</label>
            <input type="text" id="author" name="author" value="Test User">
        </div>
        <div>
            <input type="hidden" name="apiKey" value="your_secure_api_key_here">
        </div>
        <div>
            <button type="submit">Upload</button>
        </div>
    </form>
</body>
</html>
